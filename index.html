<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>知识库 · 在线学习地图</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(145deg, #f4faff 0%, #e9f2fa 100%);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            padding: 2rem 1rem;
            color: #0a2b3e;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 3rem;
            position: relative;
        }
        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            background: linear-gradient(135deg, #0f4b5e, #1e88e5, #0f4b5e);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 0.6rem;
            display: inline-block;
            padding: 0 0.5rem;
        }
        .sub {
            color: #4a6a7f;
            font-size: 1rem;
            font-weight: 500;
            border-bottom: none;
            display: block;
            margin-bottom: 0.4rem;
        }
        .stats-badge {
            background: #e0f0f5;
            color: #1f6e8c;
            border-radius: 40px;
            padding: 0.2rem 1rem;
            font-size: 0.8rem;
            font-weight: 500;
            display: inline-block;
            margin-top: 0.25rem;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.8rem;
        }
        .card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(2px);
            border-radius: 1.8rem;
            padding: 1.4rem 1.5rem;
            transition: all 0.25s ease;
            border: 1px solid rgba(30, 136, 229, 0.2);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.02), 0 1px 2px rgba(0,0,0,0.03);
            cursor: pointer;
        }
        .card:hover {
            transform: translateY(-6px);
            border-color: #1e88e5;
            box-shadow: 0 20px 30px -12px rgba(30, 136, 229, 0.25);
            background: white;
        }
        .card a {
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            color: #0f4b5e;
            display: block;
            transition: color 0.2s;
        }
        .card a:hover {
            color: #1e88e5;
            text-decoration: none;
        }
        /* 不再显示文件名 */
        .loading, .error-message {
            text-align: center;
            padding: 3rem;
            background: rgba(255,255,240,0.6);
            border-radius: 2rem;
            backdrop-filter: blur(4px);
            color: #2c6e8a;
            font-weight: 500;
        }
        .error-message {
            color: #c2571a;
        }
        .footer {
            text-align: center;
            margin-top: 3rem;
            font-size: 0.8rem;
            color: #6c8da3;
            border-top: 1px solid #cde3ea;
            padding-top: 1.5rem;
        }
        @media (max-width: 650px) {
            .grid { gap: 1rem; }
            .header h1 { font-size: 1.8rem; }
            .card { padding: 1rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1 id="mainTitle">📘 学习地图</h1>
        <div class="sub" id="subTitle">点击卡片直达笔记 · 知识常新</div>
        <div id="statsContainer"></div>
    </div>
    <div id="fileList" class="grid">
        <div class="loading">📚 正在加载学习目录，请稍候...</div>
    </div>
    <div class="footer">
        🌟 本页面动态拉取仓库中的 HTML 笔记 | 由 GitHub Pages 驱动
    </div>
</div>

<script>
    function getRepoInfo() {
        const host = window.location.hostname;
        const path = window.location.pathname;
        const githubPagesMatch = host.match(/^([^.]+)\.github\.io$/);
        if (githubPagesMatch) {
            const owner = githubPagesMatch[1];
            const parts = path.split('/').filter(p => p);
            const repo = parts.length > 0 ? parts[0] : null;
            return { owner, repo, isCustomDomain: false };
        } else {
            console.warn('当前使用自定义域名或非标准格式，使用默认仓库配置');
            return { owner: 'wangchunmei88', repo: 'AI_Knowledge_Online_test', isCustomDomain: true };
        }
    }

    function formatTitleFromRepo(repo) {
        if (!repo) return '知识库';
        let name = repo.replace(/[_\-]/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
        if (name.toLowerCase().includes('knowledge')) name = name.replace(/Knowledge/i, '知识');
        return `📖 ${name} 学习地图`;
    }

    function getBasePath() {
        const path = window.location.pathname;
        const lastSlash = path.lastIndexOf('/');
        return path.substring(0, lastSlash + 1);
    }

    function buildApiUrl(owner, repo) {
        return `https://api.github.com/repos/${owner}/${repo}/contents/`;
    }

    (function init() {
        const repoInfo = getRepoInfo();
        const { owner, repo } = repoInfo;
        if (!repo) {
            document.getElementById('fileList').innerHTML = '<div class="error-message">⚠️ 无法识别仓库名，请在自定义域名时修改代码中的默认仓库配置。</div>';
            return;
        }

        document.getElementById('mainTitle').innerHTML = formatTitleFromRepo(repo);
        document.title = formatTitleFromRepo(repo).replace(/[📖🧠]/g, '').trim() + ' | 在线学习地图';

        const apiUrl = buildApiUrl(owner, repo);
        const basePath = getBasePath();

        fetch(apiUrl)
            .then(response => {
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return response.json();
            })
            .then(data => {
                if (!Array.isArray(data)) throw new Error('API 返回非数组');
                const htmlFiles = data.filter(file => file.name && file.name.endsWith('.html') && file.name !== 'index.html');
                const container = document.getElementById('fileList');
                if (htmlFiles.length === 0) {
                    container.innerHTML = '<div class="loading">✨ 暂时还没有 HTML 笔记，上传一些吧～</div>';
                } else {
                    htmlFiles.sort((a, b) => a.name.localeCompare(b.name));
                    let html = '';
                    htmlFiles.forEach(file => {
                        let fileName = file.name;
                        let displayName = fileName.replace('.html', '').replace(/[_\-]/g, ' ');
                        displayName = displayName.replace(/^\d+/, '').replace(/^[\s_-]+/, '');
                        if (displayName === '') displayName = fileName;
                        html += `
                            <div class="card">
                                <a href="${basePath}${encodeURIComponent(fileName)}">📘 ${escapeHtml(displayName)}</a>
                            </div>
                        `;
                    });
                    container.innerHTML = html;
                }
                document.getElementById('statsContainer').innerHTML = `<div class="stats-badge">📚 共 ${htmlFiles.length} 篇笔记</div>`;
            })
            .catch(err => {
                console.error('加载失败：', err);
                document.getElementById('fileList').innerHTML = '<div class="error-message">⚠️ 加载失败，请检查网络或仓库是否公开。' + (repoInfo.isCustomDomain ? '<br>如使用自定义域名，请确认仓库名配置正确。' : '') + '</div>';
            });
    })();

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
</script>
</body>
</html>
