<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>知识库 · 在线学习地图</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #f6f9fc;
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            padding: 2rem 1rem;
            color: #1a3e50;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        .header h1 {
            font-size: 2.2rem;
            background: linear-gradient(135deg, #1f6e8c, #2e8a99);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .header p {
            color: #5b8c9e;
            margin-top: 0.5rem;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.2rem;
        }
        .card {
            background: white;
            border-radius: 1.2rem;
            padding: 1.2rem 1.2rem;
            transition: 0.2s;
            border: 1px solid #dce9f0;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }
        .card:hover {
            transform: translateY(-3px);
            border-color: #9bc4d0;
            box-shadow: 0 12px 20px -8px rgba(0,0,0,0.08);
        }
        .card a {
            text-decoration: none;
            font-weight: 600;
            font-size: 1.05rem;
            color: #1f6e8c;
            display: block;
            margin-bottom: 0.3rem;
        }
        .card a:hover {
            color: #0f4b5e;
            text-decoration: underline;
        }
        .card .file-name {
            font-size: 0.75rem;
            color: #7fa1b0;
            word-break: break-all;
        }
        .footer {
            text-align: center;
            margin-top: 2.5rem;
            font-size: 0.8rem;
            color: #8aaebd;
            border-top: 1px solid #e2edf2;
            padding-top: 1.2rem;
        }
        .loading {
            text-align: center;
            padding: 2rem;
            color: #2e8a99;
        }
        @media (max-width: 650px) {
            .grid { grid-template-columns: 1fr; }
            .header h1 { font-size: 1.6rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1 id="mainTitle">🧠 学习地图</h1>
        <p id="subTitle">点击卡片直达相应笔记 · 持续更新中</p>
    </div>
    <div id="fileList" class="grid">
        <div class="loading">📚 正在加载学习目录...</div>
    </div>
    <div class="footer">
        📌 本页面自动列出仓库中所有 .html 文件 | 由 GitHub Pages 托管
    </div>
</div>

<script>
    // 动态获取 GitHub 仓库信息（支持标准 github.io 子域名及自定义域名配置）
    function getRepoInfo() {
        const host = window.location.hostname;
        const path = window.location.pathname;
        // 匹配标准 GitHub Pages 格式：用户名.github.io/仓库名/
        const githubPagesMatch = host.match(/^([^.]+)\.github\.io$/);
        if (githubPagesMatch) {
            const owner = githubPagesMatch[1];
            // 从 path 中提取仓库名（第一个非空段）
            const parts = path.split('/').filter(p => p);
            const repo = parts.length > 0 ? parts[0] : null;
            return { owner, repo, isCustomDomain: false };
        } else {
            // 自定义域名：无法自动获取 owner/repo，回退到默认配置或提示
            // 你可以在这里手动修改为你的仓库信息
            console.warn('当前使用自定义域名，请手动配置 owner 和 repo');
            // 默认回退（请根据实际情况修改）
            return { owner: 'wangchunmei88', repo: 'AI_Knowledge_Online_test', isCustomDomain: true };
        }
    }

    // 格式化显示名称（将仓库名转换为可读标题）
    function getTitleFromRepo(repo) {
        if (!repo) return '学习地图';
        // 去掉下划线、连字符，首字母大写
        let name = repo.replace(/[_\-]/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
        // 如果包含 knowledge 等字样，可以适当精简
        if (name.toLowerCase().includes('knowledge')) {
            name = name.replace(/Knowledge/i, '知识');
        }
        return `🧠 ${name} 学习地图`;
    }

    // 动态构建 API URL
    function buildApiUrl(owner, repo) {
        return `https://api.github.com/repos/${owner}/${repo}/contents/`;
    }

    // 获取当前页面的基础路径（用于生成文件链接）
    function getBasePath() {
        const path = window.location.pathname;
        const lastSlash = path.lastIndexOf('/');
        return path.substring(0, lastSlash + 1);
    }

    // 执行
    (function() {
        const repoInfo = getRepoInfo();
        const { owner, repo, isCustomDomain } = repoInfo;
        if (!repo) {
            document.getElementById('fileList').innerHTML = '<div style="text-align:center; color:#c55a5a;">❌ 无法从当前URL识别仓库名，请在自定义域名时手动配置。</div>';
            return;
        }

        // 更新页面标题和 H1
        const titleText = getTitleFromRepo(repo);
        document.getElementById('mainTitle').innerHTML = titleText;
        document.title = titleText.replace(/🧠/, '').trim() + ' | 在线学习地图';

        const apiUrl = buildApiUrl(owner, repo);
        const basePath = getBasePath();

        fetch(apiUrl)
            .then(response => response.json())
            .then(data => {
                if (Array.isArray(data)) {
                    const htmlFiles = data.filter(file => file.name.endsWith('.html') && file.name !== 'index.html');
                    const container = document.getElementById('fileList');
                    if (htmlFiles.length === 0) {
                        container.innerHTML = '<div style="text-align:center; color:#888;">✨ 暂时还没有找到笔记，稍后回来～</div>';
                        return;
                    }
                    htmlFiles.sort((a,b) => a.name.localeCompare(b.name));
                    let html = '';
                    htmlFiles.forEach(file => {
                        const fileName = file.name;
                        let displayName = fileName.replace('.html', '').replace(/_/g, ' ');
                        // 可选：进一步美化显示名
                        displayName = displayName.replace(/^\d+/, '').replace(/[-_]/g, ' ').trim();
                        if (displayName === '') displayName = fileName;
                        html += `
                            <div class="card">
                                <a href="${basePath}${encodeURIComponent(fileName)}">📘 ${escapeHtml(displayName)}</a>
                                <div class="file-name">${escapeHtml(fileName)}</div>
                            </div>
                        `;
                    });
                    container.innerHTML = html;
                } else {
                    throw new Error('API 返回格式异常');
                }
            })
            .catch(err => {
                console.error('获取文件列表失败', err);
                document.getElementById('fileList').innerHTML = '<div style="text-align:center; color:#c55a5a;">⚠️ 无法自动加载目录，请检查网络或仓库公开性。</div>';
            });
    })();

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
</script>
</body>
</html>
